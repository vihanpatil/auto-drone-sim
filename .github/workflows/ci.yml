name: FieldGuard CI

# Runs on GitHub's servers on every push and pull request. You don't run this —
# GitHub does, in a fresh Ubuntu VM, and reports a green check or red X on each commit.
on:
  push:
  pull_request:
  workflow_dispatch: {}   # lets a human manually run build-test-sim (see that job's own comment --
                           # it's gated to workflow_dispatch only until confirmed green once)

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # ACTIVE NOW. Validates the tiger-team config + repo structure on every push.
  # This is meaningful from day one, before any ROS 2 code exists.
  # ---------------------------------------------------------------------------
  validate-config:
    name: Validate tiger-team config & structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: pip install pyyaml
      - name: Validate agents, settings.json, and structure
        run: python scripts/validate_agents.py

  # ---------------------------------------------------------------------------
  # ACTIVE (Week 2). Runs entirely on plain ubuntu-latest -- no Docker, no Gazebo, no ROS 2 --
  # because everything it exercises (fieldguard_planning geometry, the ADR-003 eval spike harness,
  # the stdlib generator scripts) is deliberately pure-Python, runs on every push, and needs no image.
  # The real headless-sim job is `build-test-sim` below (added Weeks 5-6, 2026-08-05) -- it needs the
  # Docker/Gazebo image and is manual-dispatch-only until a human confirms it runs green.
  #
  # Dependency policy (CLAUDE.md "pin everything"): tests/fieldguard_planning is stdlib-only by
  # design (zero install step). Only the eval/ spike harness needs numpy+scipy, pinned in
  # requirements-eval.txt to the exact versions verified locally on Python 3.12.12
  # (see .claude/agent-memory/devops-reliability-engineer for the reference run).
  # ---------------------------------------------------------------------------
  planning-and-eval:
    name: Planning tests + eval spike harness (numpy/scipy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Planning test suite (stdlib only, no install step)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/fieldguard_planning -v

      - name: Install eval harness dependencies (pinned)
        run: |
          set -euo pipefail
          pip install -r requirements-eval.txt

      - name: Smoke-run stdlib generator scripts (catch import/CLI breakage)
        run: |
          set -euo pipefail
          python3 scripts/gen_boustrophedon.py -o /tmp/smoke_boustrophedon.waypoints
          python3 scripts/gen_farm_world.py \
            --obstacles-out /tmp/smoke_static_obstacles.json \
            --world-out /tmp/smoke_farm_world.sdf
          # check_mission_geofence.py intentionally exits 1 when it finds the documented, EXPECTED
          # XY-only overlap at leg 4 (safe: >11m of vertical separation at mission altitude -- see
          # the script's own docstring / sim/README.md). We only want to catch import/CLI breakage
          # here, not re-gate on that already-understood business-logic exit code.
          python3 scripts/check_mission_geofence.py || true

      - name: Regenerate spike clip (fixed seed 42 -- the reproducibility regression)
        run: |
          set -euo pipefail
          python3 sim/spike/gen_spike_clip.py --seed 42 --out sim/spike/out/spike_seed42

      - name: Run eval spike harness end-to-end (label GT -> both baselines -> score)
        run: |
          set -euo pipefail
          bash eval/run_spike.sh

      - name: Assert no regression on the seed-42 headline metric
        run: |
          set -euo pipefail
          python3 scripts/check_spike_regression.py eval/results/spike_scores.json

      - name: Upload eval metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-spike-metrics
          path: eval/results/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # PROMOTED Weeks 5-6 (2026-08-05, devops-reliability-engineer) from "deferred until the image
  # exists" to committed -- see docs/WEEK5_CI_GAZEBO.md for the full plan, the honest feasibility
  # verdict on GitHub-hosted-runner Gazebo rendering (short version: NOT proven even by the upstream
  # ardupilot_gazebo/ardupilot projects' own CI, which build/lint-only on hosted runners -- see that
  # doc's "Feasibility verdict"), and the cut-list.
  #
  # ⚠️ MANUAL-DISPATCH ONLY (workflow_dispatch) until a human confirms one green run. This job pulls a
  # PREBUILT image (published by .github/workflows/sim-image.yml, itself manual/on-Dockerfile-change
  # only -- never rebuilds Gazebo+ArduPilot+ROS2 from scratch on every push) and flies a short (2-lane)
  # scripted mission through the farm world, headless. This job does NOT consume the ADR-007 NDVI
  # camera/thermal topics (no DDS, no ndvi_node) -- but the vehicle model it flies now DOES carry that
  # sensor pair (landed uncommitted mid-Week-5 by robotics-sim-engineer), so Gazebo's Sensors system
  # still renders it every frame regardless. Per docs/ROADMAP.md's Week-5 ordering, this job should run
  # AFTER the human's batched render-verification session (items 1-3: thermal kill-switch, pixel smoke
  # test, ADR-003 real-render re-confirm) -- see docs/WEEK5_CI_GAZEBO.md "Eval-gate hook" and its cut-
  # list item 6 (a camera-free CI-only world) if rendering makes this job unreliable. Flip the trigger
  # to `pull_request`/`push` only after a confirmed-green run -- do NOT flip it blind.
  # ---------------------------------------------------------------------------
  build-test-sim:
    name: Headless Gazebo/SITL smoke flight (manual until confirmed green)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read   # pull ghcr.io image published by sim-image.yml; needed even if the package
                        # ends up private (default for a new GHCR package) -- harmless if it's public
    container:
      # GHCR requires a lowercase image path; github.repository_owner is 'vihanpatil' (already
      # lowercase) for this repo, matching the tag sim-image.yml pushes -- if the owner ever changes
      # to something with uppercase, this needs a job-level lowercase workaround (container.image is
      # resolved before any step runs, so it can't reuse a step-computed value the way sim-image.yml's
      # OWNER_LC does).
      image: ghcr.io/${{ github.repository_owner }}/fieldguard-sim:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Headless Gazebo + SITL scripted smoke mission (2 lanes, no camera render)
        run: |
          set -euo pipefail
          bash scripts/ci_sim_smoke.sh

      - name: Assert the scripted mission actually completed (no regression)
        run: |
          set -euo pipefail
          python3 scripts/check_sim_smoke.py eval/results/sim_smoke.json

      - name: Upload smoke-flight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-smoke-metrics
          path: |
            eval/results/sim_smoke.json
            /tmp/ci_smoke_gz.log
            /tmp/ci_smoke_sitl.log
          if-no-files-found: warn

  # NEXT (not built yet -- see docs/WEEK5_CI_GAZEBO.md "Eval-gate hook"): once the ADR-007 real NDVI
  # render exists in sim/worlds/farmguard_field.sdf, extend build-test-sim to run eval/run_spike.sh
  # against the REAL render's output (drop-in per sim/spike/README.md's schema) and gate on FNR
  # regression the same way scripts/check_spike_regression.py already gates the synthetic clip.
