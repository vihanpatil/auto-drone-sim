name: FieldGuard sim image (build + push)

# ⚠️ UNVERIFIED (Weeks 5-6 devops task, 2026-08-05) — see docs/WEEK5_CI_GAZEBO.md for the honest
# feasibility verdict. Written and actionlint-checked, but never actually run: this session had no
# live GitHub Actions runner / GHCR credentials to execute it against. The first run needs a human to
# watch, in this order: (1) does `docker build` fit GH-hosted disk (14GB SSD on public ubuntu-latest —
# tight, see the Dockerfile.ci header), (2) does the colcon build OOM even at -j2, (3) does the job
# finish inside the runner's time budget. If any of those fail, the documented fallback is a
# self-hosted runner (docs/WEEK5_CI_GAZEBO.md "Fallback"), not a bigger hosted-runner tier.
#
# Deliberately DECOUPLED from ci.yml's per-push jobs: this build is heavy (a from-scratch ROS 2 +
# Gazebo + ArduPilot workspace compile) and does not need to run on every push/PR — only when the
# pinned versions or the image definition actually change, or on demand. ci.yml's `build-test-sim` job
# then just `docker pull`s the tag this workflow publishes; it never triggers a build itself.

on:
  workflow_dispatch: {}   # manual — the only trigger until a human confirms this builds green once
  push:
    branches: [main]
    paths:
      - "sim/docker/Dockerfile.ci"
      - "sim/docker/Dockerfile"          # the base layer Dockerfile.ci is FROM
      - "CLAUDE.md"                       # pinned-SHA changes live here
      - ".github/workflows/sim-image.yml"

permissions:
  contents: read
  packages: write   # push to GHCR (ghcr.io/<owner>/fieldguard-sim)

jobs:
  build-and-push:
    name: Build pinned-SHA sim image, push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 180   # generous ceiling for a from-scratch ROS2+Gazebo+ArduPilot build; the
                            # honest expectation (see plan doc) is this MAY exceed hosted-runner limits
    steps:
      - uses: actions/checkout@v4

      - name: Free extra disk (hosted runner is 14GB SSD — this build is tight, see Dockerfile.ci)
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"; df -h /
          # Standard hosted-runner disk-reclaim trick: drop preinstalled toolchains this job doesn't
          # use (Android SDK, .NET, GHC, CodeQL) to buy headroom for the workspace build + image layers.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          echo "Disk after cleanup:"; df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the base (Week 1) image
        run: |
          set -euo pipefail
          docker build -t fieldguard-sim:week1 -f sim/docker/Dockerfile .

      - name: Build the CI image (pinned SHAs, workspace baked in)
        run: |
          set -euo pipefail
          docker build -t fieldguard-sim:ci -f sim/docker/Dockerfile.ci .

      - name: Tag and push
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/fieldguard-sim"
          SHA_TAG="${IMAGE}:${{ github.sha }}"
          LATEST_TAG="${IMAGE}:latest"
          docker tag fieldguard-sim:ci "$SHA_TAG"
          docker tag fieldguard-sim:ci "$LATEST_TAG"
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"
          echo "Pushed $SHA_TAG and $LATEST_TAG"
